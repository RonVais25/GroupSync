  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  :root{\n    --ink:#1f2937;\n    --ink-soft:#4b5563;\n    --line:#d1d5db;\n    --line-soft:#e5e7eb;\n    --paper:#f7f6f3;\n    --primary:#7AB5DC;     /* cloud blue */\n    --primary-ink:#2f6c95;\n    --primary-soft:#e3eff8;\n    --scout:#B8A3E0;       /* light purple */\n    --scout-soft:#efe9fa;\n    --scout-ink:#5e4799;\n    --red:#E87878;\n    --red-soft:#fbe5e5;\n    --yellow:#E8B84A;\n    --yellow-soft:#fbf1d6;\n    --green:#7ECC8D;\n    --green-soft:#e3f4e6;\n  }\n  html,body{background:var(--paper);color:var(--ink);font-family:'Assistant',sans-serif;}\n  .hand{font-family:'Kalam',cursive;}\n  /* Phone frame */\n  .phone{\n    width:240px;background:#fff;border:2px solid #1f2937;border-radius:34px;\n    padding:10px 8px;box-shadow:3px 3px 0 0 #1f2937;\n  }\n  .phone-lg{width:300px;}\n  .phone-screen{\n    background:#fff;border:1px solid var(--line);border-radius:22px;\n    overflow:hidden;height:480px;display:flex;flex-direction:column;\n  }\n  .phone-lg .phone-screen{height:560px;}\n  .status-bar{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:6px 14px 4px;font-size:10px;color:var(--ink-soft);font-weight:600;\n  }\n  .home-bar{height:4px;width:80px;background:#1f2937;border-radius:99px;margin:6px auto 2px;}\n  /* Cards */\n  .card{background:#fff;border:1px solid var(--line);border-radius:12px;}\n  .card-scout{background:#fff;border:1px solid var(--line);border-radius:12px;border-right:3px solid var(--scout);}\n  .chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:600;border:1px solid var(--line);}\n  .chip-scout{background:var(--scout-soft);color:var(--scout-ink);border-color:#d9cdf0;}\n  .chip-new{background:var(--primary-soft);color:var(--primary-ink);border-color:#bfd9ec;}\n  .chip-red{background:var(--red-soft);color:#a83a3a;border-color:#f1c7c7;}\n  .chip-yellow{background:var(--yellow-soft);color:#8a6712;border-color:#ecd89a;}\n  .chip-green{background:var(--green-soft);color:#2f6f3b;border-color:#c2e2c9;}\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);}\n  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}\n  .btn-scout{background:var(--scout);color:#fff;border-color:var(--scout);}\n  .btn-ghost{background:#fff;color:var(--ink-soft);}\n  .why{display:inline-flex;align-items:center;gap:3px;font-size:9px;color:var(--scout-ink);font-weight:600;text-decoration:underline;text-decoration-style:dotted;}\n  .badge-main{\n    position:absolute;top:-10px;right:14px;\n    background:#1f2937;color:#fff;font-size:10px;font-weight:700;\n    padding:3px 10px;border-radius:99px;letter-spacing:0.02em;\n    font-family:'Kalam',cursive;\n  }\n  .arrow-wrap{\n    display:flex;flex-direction:column;align-items:center;gap:4px;\n    min-width:88px;padding-top:230px;\n  }\n  .arrow-wrap-lg{padding-top:260px;}\n  .arrow-line{\n    position:relative;width:64px;height:14px;\n  }\n  .arrow-label{\n    font-family:'Kalam',cursive;font-size:11px;color:var(--primary-ink);\n    text-align:center;line-height:1.1;max-width:90px;\n  }\n  .arrow-sub{font-size:9px;color:var(--ink-soft);font-family:'Assistant',sans-serif;}\n  .row-scroll{overflow-x:auto;padding-bottom:8px;}\n  .row-scroll::-webkit-scrollbar{height:10px;}\n  .row-scroll::-webkit-scrollbar-thumb{background:#cdd3da;border-radius:99px;}\n  .caption{width:240px;}\n  .caption-lg{width:300px;}\n  .hta{font-family:'Kalam',cursive;font-size:11px;color:var(--primary-ink);}\n  .screen-name{font-weight:700;font-size:14px;color:var(--ink);}\n  .bullet{font-size:11px;color:var(--ink-soft);line-height:1.45;}\n  .bullet::before{content:\"•\";color:var(--primary);margin-left:5px;}\n  .trigger{font-size:10px;color:var(--ink);background:#fff;border:1px dashed var(--primary);border-radius:8px;padding:5px 8px;display:flex;gap:5px;align-items:flex-start;}\n  /* Sketchy underline for section titles */\n  .sketch-underline{\n    background-image:linear-gradient(90deg,#1f2937 0,#1f2937 100%);\n    background-size:100% 3px;background-repeat:no-repeat;background-position:0 100%;\n    padding-bottom:4px;\n  }\n  /* Annotation callouts on L4 */\n  .annot{\n    position:absolute;display:flex;align-items:center;gap:6px;\n    font-family:'Kalam',cursive;font-size:11px;color:var(--scout-ink);\n    white-space:nowrap;\n  }\n  .annot-num{\n    width:22px;height:22px;border-radius:99px;background:var(--scout);color:#fff;\n    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;\n    border:2px solid #fff;box-shadow:0 0 0 1.5px var(--scout-ink);\n  }\n  .annot-line{\n    position:absolute;border-top:1.5px dashed var(--scout);\n  }\n  /* small UI primitives inside phones */\n  .row{display:flex;align-items:center;}\n  .icn{width:14px;height:14px;stroke-width:1.8;}\n  .icn-sm{width:11px;height:11px;stroke-width:1.8;}\n  .icn-lg{width:18px;height:18px;stroke-width:1.8;}\n  .divider{height:1px;background:var(--line-soft);}\n  .tab-bar{\n    display:flex;justify-content:space-around;align-items:center;\n    padding:8px 0 4px;border-top:1px solid var(--line-soft);background:#fff;\n  }\n  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--ink-soft);}\n  .tab.active{color:var(--primary-ink);}\n  .grab{width:36px;height:4px;background:#cbd5e1;border-radius:99px;margin:6px auto 8px;}\n  .progress{height:4px;background:var(--line-soft);border-radius:99px;overflow:hidden;}\n  .progress > span{display:block;height:100%;background:var(--primary);}\n  /* Table */\n  table.hta-table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;}\n  table.hta-table th,table.hta-table td{padding:10px 12px;border-bottom:1px solid var(--line-soft);text-align:right;vertical-align:top;}\n  table.hta-table thead th{background:#fff;border-bottom:2px solid #1f2937;font-weight:700;}\n  table.hta-table tbody tr:nth-child(even){background:#fafaf8;}\n  .role-pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}\n  .role-leader{background:var(--primary-soft);color:var(--primary-ink);}\n  .role-member{background:var(--scout-soft);color:var(--scout-ink);}\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"min-h-screen\" style=\"background-color: rgb(242, 238, 225)\">\n\n<!-- ============ PAGE HEADER ============ -->\n<header class=\"px-10 pt-10 pb-6 max-w-[1400px]\">\n  <div class=\"flex items-baseline gap-3\">\n    <h1 class=\"hand text-4xl font-bold sketch-underline\">GroupSync · לוח-תסריט<\u002Fh1>\n    <span class=\"text-sm text-gray-500\">Wireframe storyboard · v0.1<\u002Fspan>\n  <\u002Fdiv>\n  <p class=\"mt-3 text-[15px] text-gray-700 max-w-3xl leading-relaxed\">\n    אפליקציה לסטודנטים לניהול פרויקטים קבוצתיים. <b>Scout<\u002Fb> — סוכן AI — מציע פעולות, מסכם, מעריך מאמץ ומציע זמני עבודה. <b>סקאוט מציע, לעולם לא מחליט חברתית.<\u002Fb> שני תפקידים: <b>ראש קבוצה (נועה)<\u002Fb> — קוקפיט תפעולי · <b>חבר/ה (יואב)<\u002Fb> — תיבת דואר אישית.\n  <\u002Fp>\n  <div class=\"mt-4 flex flex-wrap gap-2 text-xs\">\n    <span class=\"chip\"><span class=\"w-2 h-2 rounded-full\" style=\"background:var(--primary)\"><\u002Fspan> Primary · Cloud-blue<\u002Fspan>\n    <span class=\"chip chip-scout\"><span class=\"w-2 h-2 rounded-full\" style=\"background:var(--scout)\"><\u002Fspan> Scout · Light-purple<\u002Fspan>\n    <span class=\"chip chip-red\">Status · אדום<\u002Fspan>\n    <span class=\"chip chip-yellow\">Status · צהוב<\u002Fspan>\n    <span class=\"chip chip-green\">Status · ירוק<\u002Fspan>\n    <span class=\"chip\">קלף לבן · גבול דק · רדיוס 12<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ===
